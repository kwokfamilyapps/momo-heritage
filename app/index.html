<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>鞍山探索館 · 山徑與水道巡查記錄</title>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/piexifjs/1.0.6/piexif.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 36px; }
  body {
    font-family: -apple-system, "Noto Sans HK", "PingFang HK", "Microsoft JhengHei", sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    line-height: 1.8;
    padding: 0;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
  }
  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1a3a2a, #0d2a1a);
    padding: 0.5rem 1rem;
    text-align: center;
    border-bottom: 2px solid #40a060;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex; align-items: center; gap: 0.5rem;
  }
  .header-icon { width: 2rem; height: 2rem; border-radius: 6px; flex-shrink: 0; }
  .header-text { flex: 1; text-align: left; }
  .header h1 { font-size: 0.8rem; color: #c0e8c0; margin: 0; }
  .header .sub { font-size: 0.45rem; color: #80a080; margin: 0; }
  .header .user-badge {
    display: inline-block; background: #2a4a3a; color: #80e080;
    padding: 0.1rem 0.5rem; border-radius: 20px; font-size: 0.45rem; white-space: nowrap;
  }
  /* ── Screens ── */
  .screen { display: none; padding: 0.8rem; }
  .screen.active { display: block; }

  /* ── Login ── */
  .login-box {
    background: #10181a; border: 1px solid #1a2a2a; border-radius: 14px;
    padding: 2rem 1.5rem; margin-top: 3rem;
  }
  .login-box h2 { font-size: 1.1rem; color: #60c080; text-align: center; margin-bottom: 1rem; }
  .login-btn {
    display: block; width: 100%; padding: 1rem;
    margin: 0.6rem 0; border: none; border-radius: 12px;
    font-size: 0.9rem; font-weight: 600; cursor: pointer;
  }
  .login-btn.admin { background: #2a4a6a; color: #c0e0ff; }
  .login-btn.vol { background: #2a4a3a; color: #c0e8c0; }

  /* ── Buttons ── */
  .btn {
    display: inline-block; padding: 0.6rem 1.2rem; border: none; border-radius: 10px;
    font-size: 0.7rem; font-weight: 600; cursor: pointer; text-align: center;
  }
  .btn-primary { background: #2a6a4a; color: #fff; }
  .btn-secondary { background: #2a2a3a; color: #c0c0e0; }
  .btn-danger { background: #6a2a2a; color: #ffa0a0; }
  .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.55rem; }
  .btn-full { width: 100%; margin: 0.4rem 0; }

  /* ── Form ── */
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 0.7rem; color: #80b080; margin-bottom: 0.3rem; font-weight: 600; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 0.6rem; border: 1px solid #2a3a2a; border-radius: 10px;
    background: #0c0c14; color: #e0e0e0; font-size: 0.7rem;
  }
  .form-group textarea { min-height: 3rem; resize: vertical; }
  .form-group .hint { font-size: 0.5rem; color: #666; margin-top: 0.15rem; }
  /* GPS live box */
  .gps-box {
    background: #0c1418; border: 1px solid #2a4a3a; border-radius: 8px;
    padding: 0.3rem 0.5rem; margin: 0.3rem 0; font-size: 0.5rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .gps-box .label { color: #60a080; }
  .gps-box .coords { color: #80e0c0; font-family: monospace; }
  .gps-box .status { color: #888; font-size: 0.4rem; }

  /* ── Checkbox Grid ── */
  .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
  .check-grid label {
    display: flex; align-items: center; gap: 0.4rem;
    font-size: 0.6rem; color: #aaa; padding: 0.4rem;
    background: #0c0c14; border-radius: 8px; border: 1px solid #1a1a2a;
  }
  .check-grid input[type="checkbox"] { width: 1.2rem; height: 1.2rem; }

  /* ── Photo Upload ── */
  .photo-zone {
    border: 2px dashed #2a4a3a; border-radius: 12px; padding: 1rem;
    text-align: center; color: #888; font-size: 0.6rem; cursor: pointer;
    margin: 0.4rem 0;
  }
  .photo-previews { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .photo-previews .thumb {
    width: 5rem; height: 5rem; border-radius: 8px; overflow: hidden;
    position: relative; background: #0c0c14; border: 1px solid #2a2a3a;
  }
  .photo-previews .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .photo-previews .thumb .del {
    position: absolute; top: 0; right: 0; background: rgba(200,0,0,0.7);
    color: #fff; width: 1rem; height: 1rem; font-size: 0.5rem;
    text-align: center; line-height: 1rem; cursor: pointer; border-radius: 0 6px 0 6px;
  }

  /* ── Record List ── */
  .record-card {
    background: #10181a; border: 1px solid #1a2a2a; border-radius: 12px;
    padding: 0.8rem; margin: 0.6rem 0;
  }
  .record-card .date { font-size: 0.55rem; color: #888; }
  .record-card .trail { font-size: 0.75rem; color: #c0e8c0; font-weight: 600; }
  .record-card .type { font-size: 0.55rem; color: #80b080; margin-top: 0.1rem; }
  .record-card .issues { font-size: 0.55rem; color: #aaa; margin-top: 0.25rem; }

  /* ── Nav ── */
  .nav-bar {
    display: flex; gap: 0.3rem; padding: 0.6rem;
    background: #0c0c14; border-top: 1px solid #1a1a2a; position: sticky; bottom: 0;
  }
  .nav-btn {
    flex: 1; text-align: center; padding: 0.5rem; border: none; border-radius: 8px;
    background: transparent; color: #888; font-size: 0.55rem; cursor: pointer;
  }
  .nav-btn.active { background: #1a3a2a; color: #60c080; }

  .tabs { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; }
  .tab { padding: 0.4rem 0.8rem; border: 1px solid #2a3a2a; border-radius: 8px;
    font-size: 0.55rem; cursor: pointer; color: #888; background: #0c0c14; }
  .tab.active { background: #1a3a2a; color: #60c080; border-color: #40a060; }

  /* ── Admin ── */
  .admin-section { display: none; }
  .admin-section.show { display: block; }

  @media (max-width: 600px) {
    html { font-size: 28px; }
    .check-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div class="header" id="appHeader">
  <img class="header-icon" src="https://raw.githubusercontent.com/kwokfamilyapps/momo-heritage/main/app/icon-192.png" alt="icon" onerror="this.style.display='none'">
  <div class="header-text">
    <h1>🏞️ 鞍山探索館</h1>
    <div class="sub">山徑及水道巡查記錄工具</div>
    <div style="font-size:0.4rem;color:#60a060;margin-top:0.05rem;">策劃人：Ming Kwok</div>
  </div>
  <div class="user-badge" id="userBadge">未登入</div>
</div>

<!-- ═══ SCREEN: LOGIN ═══ -->
<div class="screen active" id="screenLogin">
  <div class="login-box">
    <h2>🔐 登入</h2>
    <button class="login-btn admin" onclick="login('admin')">👤 Admin 登入</button>
    <button class="login-btn vol" onclick="login('vol')">👥 義工隊登入</button>
    <div style="text-align:center;margin-top:1.5rem;">
      <button class="btn btn-secondary btn-full" onclick="exitLogin()">🚪 離開</button>
    </div>
  </div>
</div>

<!-- ═══ SCREEN: MAIN ═══ -->
<div class="screen" id="screenMain">
  <div id="tabContent"></div>
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchTab('form')">✏️ 填寫</button>
    <button class="nav-btn" onclick="switchTab('list')">📋 查閱</button>
    <button class="nav-btn" onclick="switchTab('map')">🗺️ 地圖</button>
    <button class="nav-btn admin-only" onclick="switchTab('admin')" id="adminTabBtn">⚙️ 管理</button>
    <button class="nav-btn" onclick="exitApp()">🚪 退出</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════
const TRAILS = [
  "馬鞍山郊遊徑",
  "礦場遺址路線",
  "礦村路線",
  "恩光堂路線",
  "鹿巢山路線",
  "昂平路線",
  "其他"
];

const TRAIL_ISSUES = [
  "垃圾黑點", "山徑水土流失", "山徑路面擴闊", "山徑路面泥濘",
  "山徑樹根外露", "山徑複線化", "捷徑", "設施損壞", "營火痕跡", "其他"
];

const WATER_ISSUES = [
  "完全暢通", "部份阻塞", "完全阻塞（清理後功能恢復）",
  "失效（清理後不能恢復功能）", "已損毀", "其他"
];

const TRAIL_SOLUTIONS = [
  "堵截捷徑", "石籃修復", "通知漁護署維修",
  "暫不用處理", "另行再議（需跟進）", "其他"
];

const WATER_SOLUTIONS = [
  "義工清理水道", "通知漁護署維修", "暫不用處理", "另行再議（需跟進）", "其他"
];

// ══════════════════════════════════════════════
// FIREBASE INIT
// ══════════════════════════════════════════════
const firebaseConfig = {
    apiKey: "...",
    authDomain: "mos-trail-patrol.firebaseapp.com",
    projectId: "mos-trail-patrol",
    storageBucket: "mos-trail-patrol.firebasestorage.app",
    messagingSenderId: "969542665711",
    appId: "1:969542665711:web:476f010a61279b200be21a"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  db.enablePersistence().catch(err => console.log("🔥 P: " + err.code));

  // ══════════════════════════════════════════════
  // STATE
  // ══════════════════════════════════════════════
  let state = {
    user: null,
    tab: 'form',
    activityType: 'trail',
    records: [],
    photos: [],
    editId: null,
    currentGps: null,
    watchId: null
  };

  // Load from Firestore on startup — only on first load, not overwrite local records
  let _initialLoadDone = false;
  async function loadRecords() {
    if (_initialLoadDone) return; // 防止重複執行清空記錄
    _initialLoadDone = true;
    try {
      const snap = await db.collection('records').orderBy('createdAt','desc').get();
      // 只有在當前無本地記錄時先 load（避免 overwrite 用戶剛輸入嘅記錄）
      if (state.records.length === 0) {
        snap.forEach(doc => state.records.push({ id: doc.id, ...doc.data() }));
      }
      if (state.user) {
        if (state.tab === 'list') renderList();
        else if (state.tab === 'admin') renderAdmin();
        else if (state.tab === 'map') renderMap();
      }
    } catch(e) {
      console.log("🔥 Load err: " + e.message);
    }
  }

// ══════════════════════════════════════════════
// LOGIN / LOGOUT
// ══════════════════════════════════════════════
const PASSWORDS = {
  admin: 'admin2024'
};

function login(role) {
  if (role === 'admin') {
    const pwd = prompt('請輸入 Admin 密碼：');
    if (!pwd) return;
    if (pwd !== PASSWORDS.admin) {
      alert('❌ 密碼錯誤');
      return;
    }
  }
  state.user = { role };
  document.getElementById('userBadge').textContent = role === 'admin' ? '👤 Admin' : '👥 義工隊';
  document.getElementById('screenLogin').classList.remove('active');
  document.getElementById('screenMain').classList.add('active');
  document.getElementById('adminTabBtn').style.display = role === 'admin' ? 'block' : 'none';
  renderForm();
  renderList();
  startGpsTracking();
  // Load from Firestore
  loadRecords();
}

function logout() {
  state.user = null;
  document.getElementById('screenMain').classList.remove('active');
  document.getElementById('screenLogin').classList.add('active');
  document.getElementById('userBadge').textContent = '未登入';
  document.getElementById('adminTabBtn').style.display = 'none';
}

function exitApp() {
  if (confirm('確定退出 App？')) {
    logout();
  }
}

function exitLogin() {
  if (confirm('確定離開？')) {
    // Show a message that they can close the tab
    document.getElementById('screenLogin').innerHTML = `
      <div class="login-box" style="text-align:center;">
        <h2>👋 感謝使用</h2>
        <p style="color:#888;margin:1rem 0;">你可以關閉此分頁</p>
        <button class="login-btn vol" onclick="location.reload()">🔄 重新啟動</button>
      </div>`;
  }
}

// ══════════════════════════════════════════════
// TAB SWITCH
// ══════════════════════════════════════════════
function switchTab(tab) {
  state.tab = tab;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('.nav-btn');
  const idx = ['form','list','admin','logout'].indexOf(tab);
  if (idx >= 0 && btns[idx]) btns[idx].classList.add('active');
  if (tab === 'form') { renderForm(); startGpsTracking(); }
  else if (tab === 'list') { renderList(); stopGpsTracking(); }
  else if (tab === 'map') { renderMap(); stopGpsTracking(); }
  else if (tab === 'admin') { renderAdmin(); stopGpsTracking(); }
}

// ══════════════════════════════════════════════
// CLOUD SYNC (disabled - using localStorage only)
// ══════════════════════════════════════════════
async function syncToCloud(record) {
  // Firestore auto-sync handles this
  console.log("🔥 Synced:", record.id);
}

async function loadFromCloud() {
  // Use loadRecords for Firestore
  loadRecords();
}

// LOAD DATA ON STARTUP - done at top of script
// No duplicate DOMContentLoaded handler needed

// ══════════════════════════════════════════════
// RENDER FORM
// ══════════════════════════════════════════════
let photoCount = 0;

function renderForm() {
  const r = state.editId ? state.records.find(rec => rec.id === state.editId) : null;
  const today = new Date().toISOString().split('T')[0];

  let html = `<div style="margin-bottom:0.6rem;">
    <div class="tabs">
      <div class="tab ${state.activityType==='trail'?'active':''}" onclick="setActivity('trail')">🪨 山徑問題</div>
      <div class="tab ${state.activityType==='water'?'active':''}" onclick="setActivity('water')">💧 水道記錄</div>
    </div>
  </div>
  <form id="recordForm">
    <div class="form-group">
      <label>📅 日期</label>
      <input type="date" id="fDate" value="${r ? r.date : today}">
    </div>
    <div class="form-group">
      <label>👤 記錄人員</label>
      <input type="text" id="fRecorder" value="${r ? r.recorder : ''}" placeholder="姓名">
    </div>
    <div class="form-group">
      <label>🛤️ 山徑名稱</label>
      <select id="fTrail">`;

  TRAILS.forEach(t => {
    const sel = r && r.trail === t ? 'selected' : '';
    html += `<option value="${t}" ${sel}>${t}</option>`;
  });

  html += `</select>
      <input type="text" id="fTrailOther" placeholder="其他山徑名稱" style="margin-top:0.3rem;display:${r && r.trail === '其他' ? 'block' : 'none'};">
    </div>`;

  if (state.activityType === 'trail') {
    html += `<div class="form-group">
      <label>⚠️ 山徑問題（可選多項）</label>
      <div class="check-grid">`;
    TRAIL_ISSUES.forEach(issue => {
      const checked = r && r.issues && r.issues.includes(issue) ? 'checked' : '';
      html += `<label><input type="checkbox" class="trail-issue" value="${issue}" ${checked}>${issue}</label>`;
    });
    html += `</div></div>
    <div class="form-group">
      <label>🔧 建議處理方法</label>
      <select id="fSolution">`;
    TRAIL_SOLUTIONS.forEach(s => {
      const sel = r && r.solution === s ? 'selected' : '';
      html += `<option value="${s}" ${sel}>${s}</option>`;
    });
    html += `</select>
    </div>`;
  } else {
    html += `<div class="form-group">
      <label>💧 水道狀況（可選多項）</label>
      <div class="check-grid">`;
    WATER_ISSUES.forEach(issue => {
      const checked = r && r.issues && r.issues.includes(issue) ? 'checked' : '';
      html += `<label><input type="checkbox" class="water-issue" value="${issue}" ${checked}>${issue}</label>`;
    });
    html += `</div></div>
    <div class="form-group">
      <label>🔧 建議處理方法</label>
      <select id="fSolution">`;
    WATER_SOLUTIONS.forEach(s => {
      const sel = r && r.solution === s ? 'selected' : '';
      html += `<option value="${s}" ${sel}>${s}</option>`;
    });
    html += `</select>
    </div>`;
  }

  // GPS live coordinate box
  const isEditing = !!state.editId;
  html += `<div class="gps-box">
    <span class="label">📍 當前位置</span>
    <span class="coords" id="gpsDisplay">${state.currentGps ? state.currentGps.lat.toFixed(4)+', '+state.currentGps.lng.toFixed(4) : '擷取中…'}</span>
    <span class="status" id="gpsStatus">${state.currentGps ? '✅' : '⏳'}</span>
  </div>`;

  // Photos
  if (!isEditing) {
    const photos = r ? r.photos || [] : [];
    html += `<div class="form-group">
      <label>📸 相片記錄（最多 3 張）</label>
      <div class="photo-zone" onclick="document.getElementById('photoInput').click()">
        + 點擊新增相片
      </div>
      <input type="file" id="photoInput" accept="image/*" multiple style="display:none" onchange="handlePhotos(event)">
      <div class="photo-previews" id="photoPreviews">`;
    photos.forEach((p, idx) => {
      html += `<div class="thumb"><img src="${p}" alt="photo"><div class="del" onclick="removePhoto(${idx})">×</div></div>`;
    });
    html += `</div>
      <div class="hint">每次最多 3 張，相片會自動加入 GPS 位置資料</div>
    </div>`;
  } else {
    html += `<div class="form-group">
      <label>📸 相片</label>
      <div style="font-size:0.5rem;color:#666;padding:0.4rem;">修改記錄時不能更換相片。如需更改請刪除此記錄重新建立。</div>
    </div>`;
  }

  html += `<div class="form-group">
    <label>📝 備註</label>
    <textarea id="fNote" placeholder="其他補充…">${r ? (r.note||'') : ''}</textarea>
  </div>

  <div style="display:flex;gap:0.3rem;">
    <button type="button" class="btn btn-primary btn-full" onclick="submitRecord()">${state.editId ? '📝 更新記錄' : '✅ 提交記錄'}</button>
    ${state.editId ? `<button type="button" class="btn btn-secondary btn-full" onclick="cancelEdit()">取消</button>` : ''}
  </div>
  </form>`;

  document.getElementById('tabContent').innerHTML = html;
  state.photos = photos;
}

function setActivity(type) {
  state.activityType = type;
  state.editId = null;
  state.photos = [];
  renderForm();
}

// ══════════════════════════════════════════════
// PHOTOS — IndexedDB persistent storage
// ══════════════════════════════════════════════
const MAX_PHOTO_PX = 1024;
const DB_NAME = 'TrailPatrolPhotos';
const STORE_NAME = 'photos';

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function savePhotoToDB(key, dataUrl) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(dataUrl, key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

async function getPhotoFromDB(key) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => { db.close(); resolve(req.result); };
    req.onerror = () => { db.close(); reject(req.error); };
  });
}

async function deletePhotoFromDB(key) {
  const db = await openPhotoDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => { db.close(); resolve(); };
    tx.onerror = () => { db.close(); reject(tx.error); };
  });
}

// ── GPS LIVE TRACKING ──
function startGpsTracking() {
  if (!navigator.geolocation) return;
  if (state.watchId !== null) return;
  state.watchId = navigator.geolocation.watchPosition(function(pos) {
    state.currentGps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    var d = document.getElementById('gpsDisplay');
    var s = document.getElementById('gpsStatus');
    if (d) d.textContent = state.currentGps.lat.toFixed(4) + ', ' + state.currentGps.lng.toFixed(4);
    if (s) s.textContent = '✅';
  }, function() {
    var d = document.getElementById('gpsDisplay');
    var s = document.getElementById('gpsStatus');
    if (d) d.textContent = 'GPS 無法使用';
    if (s) s.textContent = '❌';
  }, { enableHighAccuracy: true, timeout: 10000 });
}

function stopGpsTracking() {
  if (state.watchId !== null) {
    navigator.geolocation.clearWatch(state.watchId);
    state.watchId = null;
  }
}

// Embed GPS EXIF into JPEG dataUrl
function embedGpsExif(dataUrl, gps) {
  if (!gps || !gps.lat || !gps.lng || typeof piexif === 'undefined') return dataUrl;
  try {
    var exifObj = piexif.load(dataUrl);
    // Convert decimal degrees to EXIF rational format (deg, min, sec)
    function toDms(deg) {
      var d = Math.abs(deg) | 0;
      var m = (Math.abs(deg) * 60) % 60 | 0;
      var s = ((Math.abs(deg) * 3600) % 60) * 1000 | 0;
      return [[d, 1], [m, 1], [s, 1000]];
    }
    exifObj.GPS = {
      GPSLatitudeRef: gps.lat >= 0 ? 'N' : 'S',
      GPSLatitude: toDms(gps.lat),
      GPSLongitudeRef: gps.lng >= 0 ? 'E' : 'W',
      GPSLongitude: toDms(gps.lng),
      GPSVersionID: [2, 3, 0, 0]
    };
    return piexif.insert(exifObj, dataUrl);
  } catch(e) {
    console.log('📌 EXIF error:', e.message);
    return dataUrl;
  }
}

function handlePhotos(e) {
  const files = Array.from(e.target.files);
  const remaining = 3 - state.photos.length;
  const toAdd = files.slice(0, remaining);
  toAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        let w = img.width, h = img.height;
        if (w > MAX_PHOTO_PX || h > MAX_PHOTO_PX) {
          const ratio = Math.min(MAX_PHOTO_PX / w, MAX_PHOTO_PX / h);
          w = Math.round(w * ratio);
          h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var resized = canvas.toDataURL('image/jpeg', 0.8);
        // Embed GPS EXIF into photo
        if (state.currentGps) {
          resized = embedGpsExif(resized, state.currentGps);
        }
        state.photos.push(resized);
        updatePhotoPreview();
        savePhotoToDisk(file.name || 'photo.jpg', resized);
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
  e.target.value = '';
}

// When submitting a record: save photos to IndexedDB
async function persistPhotosForRecord(recordId) {
  const keys = [];
  for (let i = 0; i < state.photos.length; i++) {
    const key = recordId + '_' + i;
    await savePhotoToDB(key, state.photos[i]);
    keys.push(key);
  }
  return keys;
}

// When loading a record: restore photos from IndexedDB
async function loadPhotosForRecord(photoKeys) {
  const photos = [];
  for (const key of (photoKeys || [])) {
    const dataUrl = await getPhotoFromDB(key);
    if (dataUrl) photos.push(dataUrl);
  }
  return photos;
}

function getAlbumName() {
  const lang = (navigator.language || navigator.userLanguage || 'en').slice(0, 2);
  const names = {
    'zh': '山徑巡查', 'en': 'TrailPatrol', 'ja': 'トレイルパトロール',
    'ko': '트레일순찰', 'es': 'PatrullaSendero', 'fr': 'PatrouilleSentier',
    'pt': 'PatrulhaTrilha', 'default': 'TrailPatrol'
  };
  return names[lang] || names['default'];
}

function savePhotoToDisk(filename, dataUrl) {
  const album = getAlbumName();
  const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
  const friendlyName = album + '_' + ts + '.jpg';
  
  // Convert data URL to Blob
  const byteString = atob(dataUrl.split(',')[1]);
  const mimeType = 'image/jpeg';
  const ab = new ArrayBuffer(byteString.length);
  const ia = new Uint8Array(ab);
  for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
  const blob = new Blob([ab], { type: mimeType });
  
  // Try Share API first (works on iOS - can save to Files/Photos)
  if (navigator.share && /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
    navigator.share({
      title: friendlyName,
      text: album + ' 相片',
      files: [new File([blob], friendlyName, { type: mimeType })]
    }).catch(function() {
      // User cancelled share - that's fine
    });
    return;
  }
  
  // Fallback: download link (works on desktop Android)
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = friendlyName;
  link.style.display = 'none';
  document.body.appendChild(link);
  link.click();
  setTimeout(function() {
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  }, 100);
}

function removePhoto(idx) {
  state.photos.splice(idx, 1);
  updatePhotoPreview();
}

function updatePhotoPreview() {
  const container = document.getElementById('photoPreviews');
  if (!container) return;
  container.innerHTML = '';
  state.photos.forEach((p, idx) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${p}" alt="photo"><div class="del" onclick="removePhoto(${idx})">×</div>`;
    container.appendChild(div);
  });
}

// ══════════════════════════════════════════════
// SUBMIT
// ══════════════════════════════════════════════
function submitRecord() {
  const date = document.getElementById('fDate')?.value;
  const recorder = document.getElementById('fRecorder')?.value;
  const trail = document.getElementById('fTrail')?.value;
  const trailOther = document.getElementById('fTrailOther')?.value;
  const solution = document.getElementById('fSolution')?.value;
  const note = document.getElementById('fNote')?.value;

  if (!date || !recorder || !recorder.trim()) {
    alert('⚠️ 請填寫日期和記錄人員');
    return;
  }

  let issues = [];
  if (state.activityType === 'trail') {
    document.querySelectorAll('.trail-issue:checked').forEach(cb => issues.push(cb.value));
  } else {
    document.querySelectorAll('.water-issue:checked').forEach(cb => issues.push(cb.value));
  }

  const recordId = state.editId || Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
  const record = {
    id: recordId,
    date, recorder: recorder.trim(),
    trail: trail === '其他' ? (trailOther || '其他') : trail,
    activityType: state.activityType,
    issues, solution, note: note || '',
    photoKeys: state.photos.length > 0 ? state.photos.map((_, i) => recordId + '_' + i) : [],
    createdBy: state.user.role,
    createdAt: new Date().toISOString()
  };

  if (state.editId) {
    const idx = state.records.findIndex(r => r.id === state.editId);
    if (idx >= 0) {
      state.records[idx] = record;
      db.collection('records').doc(record.id).set(record).then(function() {
        console.log("🔥 SYNC OK:", record.id);
      }).catch(function(e) {
        console.log("🔥 SYNC FAIL:", record.id, e.code, e.message);
        alert("⚠️ 記錄未能同步到雲端: " + e.message);
      });
    }
  } else {
    const last = state.records[0];
    if (last && last.date === record.date && last.recorder === record.recorder &&
        last.trail === record.trail && JSON.stringify(last.issues) === JSON.stringify(record.issues)) {
      if (!confirm('⚠️ 同上一筆記錄相似，確定要重複提交？')) return;
    }
    state.records.unshift(record);
    // Persist photos to IndexedDB
    persistPhotosForRecord(recordId).then(function() {
      console.log("📸 Photos saved to IndexedDB:", record.photoKeys.length);
    });
    // Use live tracking GPS if available
    var gpsToSave = state.currentGps;

    // Use add() for new records
    db.collection('records').add(record).then(function(docRef) {
      console.log("🔥 SYNC OK:", docRef.id);
      // Update local record with Firestore-generated ID
      if (state.records[0] && state.records[0].id === record.id) {
        state.records[0].id = docRef.id;
      }
      // GPS capture — 用 Firestore 正確 ID + live GPS
      if (gpsToSave) {
        db.collection('records').doc(docRef.id).update({ gps: gpsToSave }).then(function() {
          console.log("📌 GPS OK:", docRef.id);
        }).catch(function(e) {
          console.log("📌 GPS FAIL:", e.code, e.message);
        });
        if (state.records[0]) {
          state.records[0].gps = pendingGps;
        }
      }
    }).catch(function(e) {
      console.log("🔥 SYNC FAIL:", e.code, e.message);
      alert("⚠️ 記錄未能同步到雲端\\n" + e.code + ": " + e.message);
    });
  }

  // 即時跳去查閱頁（唔等 GPS）
  state.editId = null;
  state.photos = [];
  state.activityType = 'trail';
  switchTab('list');
  renderList();
}

function renderList() {
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
    <h2 style="font-size:0.8rem;color:#60c080;">📋 巡查紀錄</h2>

  </div>`;

  if (state.records.length === 0) {
    html += `<p style="text-align:center;color:#555;margin-top:3rem;">暫無記錄</p>`;
  } else {
    state.records.forEach(r => {
      const canEdit = state.user.role === 'admin' || r.createdBy === 'vol';
      html += `<div class="record-card">
        <div class="date">${r.date} · ${r.createdBy === 'admin' ? 'Admin' : '義工'}</div>
        <div class="trail">${r.trail}</div>
        <div class="type">${r.activityType === 'trail' ? '🪨 山徑' : '💧 水道'}</div>
        <div class="issues"><strong>問題：</strong>${(r.issues||['']).join('、')}</div>
        ${r.solution ? `<div class="issues"><strong>建議：</strong>${r.solution}</div>` : ''}
        ${r.recorder ? `<div class="issues"><strong>記錄：</strong>${r.recorder}</div>` : ''}
        ${r.note ? `<div class="issues"><strong>備註：</strong>${r.note}</div>` : ''}
        ${r.photoKeys && r.photoKeys.length > 0 ? `<div class="issues"><strong>相片：</strong>${r.photoKeys.length} 張</div>` : ''}
        ${canEdit ? `<div style="margin-top:0.3rem;">
          <button class="btn btn-sm btn-secondary" onclick="editRecord('${r.id}')">✏️ 修改</button>
          <button class="btn btn-sm btn-danger" onclick="deleteRecord('${r.id}')">🗑️ 刪除</button>
        </div>` : ''}
      </div>`;
    });
  }

  // Export
  if (state.user.role === 'admin') {
    html += `<div style="margin-top:1rem;">
      <button class="btn btn-primary btn-full" onclick="exportCSV()">📊 匯出報表 (CSV)</button>
    </div>`;
  }

  document.getElementById('tabContent').innerHTML = html;
}

// ── MAP VIEW ──
function renderMap() {
  let html = `<h2 style="font-size:0.8rem;color:#60c080;margin-bottom:0.5rem;">🗺️ 巡查地圖</h2>
  <div id="mapContainer" style="height:55vh;border-radius:12px;overflow:hidden;border:1px solid #2a3a2a;background:#0c0c14;"></div>
  <div style="margin-top:0.5rem;font-size:0.55rem;color:#888;" id="mapStatus">載入地圖中…</div>`;
  document.getElementById('tabContent').innerHTML = html;

  // Load Leaflet
  const link = document.createElement('link');
  link.rel = 'stylesheet';
  link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
  document.head.appendChild(link);

  const script = document.createElement('script');
  script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
  script.onload = function() {
    const map = L.map('mapContainer').setView([22.403, 114.245], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap',
      maxZoom: 18
    }).addTo(map);

    // Add markers and route lines
    let count = 0;
    const trailPoints = [];
    const waterPoints = [];

    state.records.forEach(r => {
      if (r.gps && r.gps.lat && r.gps.lng) {
        const color = r.activityType === 'trail' ? '#4a8a5a' : '#4080c0';
        const latlng = [r.gps.lat, r.gps.lng];
        if (r.activityType === 'trail') {
          trailPoints.push(latlng);
        } else {
          waterPoints.push(latlng);
        }

        // Build popup content
        let popupHtml = `<b>${r.trail}</b><br>${r.date}<br>${r.recorder || ''}<br>${(r.issues||[]).join('、')}`;
        var pc = (r.photoKeys && r.photoKeys.length) || (r.photos && r.photos.length) || 0;
        if (pc > 0) {
          popupHtml += '<br><div style="font-size:0.5rem;color:#888;">📸 ' + pc + ' 張相片</div>';
        }

        L.circleMarker(latlng, {
          radius: 14, color: color, fillColor: color, fillOpacity: 0.7
        }).addTo(map)
          .bindPopup(popupHtml);
        count++;
      }
    });

    // Draw trail route — green dashed line
    if (trailPoints.length >= 2) {
      L.polyline(trailPoints.reverse(), {
        color: '#4a8a5a',
        weight: 5,
        opacity: 0.7,
        dashArray: '10, 10'
      }).addTo(map);
    }

    // Draw water route — blue dashed line
    if (waterPoints.length >= 2) {
      L.polyline(waterPoints.reverse(), {
        color: '#4080c0',
        weight: 5,
        opacity: 0.7,
        dashArray: '10, 10'
      }).addTo(map);
    }

    document.getElementById('mapStatus').innerHTML =
      count > 0
        ? '<div style="font-size:0.55rem;">📍 已顯示 ' + count + ' 個有 GPS 嘅記錄</div>'
          + '<div style="font-size:0.45rem;color:#888;margin-top:0.2rem;">'
          + '<span style="color:#4a8a5a;">🟢</span> 山徑 · '
          + '<span style="color:#4080c0;">🔵</span> 水道 · '
          + '<span style="color:#4a8a5a;">- - -</span> 山徑路線 · '
          + '<span style="color:#4080c0;">- - -</span> 水道路線'
          + '</div>'
        : '📌 暫無 GPS 記錄 — 填寫時系統會自動記錄位置';

    // If no GPS records, try getting current position
    if (count === 0 && navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 15);
        document.getElementById('mapStatus').textContent = '📍 顯示你目前位置';
      }, () => {});
    }
  };
  document.body.appendChild(script);
}

function editRecord(id) {
  state.editId = id;
  state.photos = [];
  const rec = state.records.find(r => r.id === id);
  if (rec) state.activityType = rec.activityType;
  renderForm();
}

function deleteRecord(id) {
  if (!confirm('確定刪除此記錄？')) return;
  state.records = state.records.filter(r => r.id !== id);
  db.collection('records').doc(id).delete().catch(e => console.log("🔥", e));
  renderList();
}

function clearAllRecords() {
  if (!confirm('確定清除所有記錄？此操作不可復原！')) return;
  if (!confirm(`再次確認：清除全部 ${state.records.length} 項記錄？`)) return;
  const batch = db.batch();
  state.records.forEach(r => batch.delete(db.collection('records').doc(r.id)));
  batch.commit().catch(e => console.log("🔥", e));
  state.records = [];
  renderAdmin();
}

// ══════════════════════════════════════════════
// EXPORT
// ══════════════════════════════════════════════
function exportCSV() {
  let csv = "日期,記錄人員,山徑名稱,類別,問題,建議處理方法,備註,相片數\n";
  state.records.forEach(r => {
    const issues = (r.issues||[]).join(';');
    const pc = (r.photoKeys && r.photoKeys.length) || (r.photos && r.photos.length) || 0;
    csv += `"${r.date}","${r.recorder||''}","${r.trail}","${r.activityType==='trail'?'山徑':'水道'}","${issues}","${r.solution||''}","${r.note||''}","${pc}"\n`;
  });
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `巡查記錄_${new Date().toISOString().split('T')[0]}.csv`;
  link.click();
}
